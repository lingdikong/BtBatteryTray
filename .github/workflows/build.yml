name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # A release tag must match the version baked into the packages
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          scripts/build-installer.ps1

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/build-macos.sh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: BtBatteryTray-${{ runner.os }}
          path: |
            target/installer/*.exe
            target/dist/*.dmg
            target/dist/*.tar.gz
          if-no-files-found: error

  # On a v* tag, publish one GitHub Release with the packages of all three platforms.
  # A separate job (instead of uploading from each build job) avoids racing to create the release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Artifacts keep their paths below target/ (installer/*.exe, dist/*.dmg, ...); flatten them
      - name: Collect packages
        run: |
          mkdir release
          find dist -type f -exec mv {} release/ \;
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
